<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Josh Christian </title>
</head>

<body>

    <div id="app"></div>

    <script>
        // =========================
        // 1. CREATE HTML ELEMENTS
        // =========================

        const app = document.getElementById("app");

        const title = document.createElement("h1");
        title.textContent = "⚡Death Play";

        const subtitle = document.createElement("p");
        subtitle.textContent = "Simple HTML + JavaScript Only";

        const card = document.createElement("div");

        const name = document.createElement("h2");
        name.textContent = "👋 Welcome, Josh Christian!";

        const description = document.createElement("p");
        description.textContent =
            "This page uses JavaScript to create the design without CSS.";

        const button = document.createElement("button");
        button.textContent = "✨ Change Theme";

        const counter = document.createElement("p");
        counter.textContent = "Button Clicks: 0";

        // Add elements to page
        app.appendChild(title);
        app.appendChild(subtitle);
        app.appendChild(card);

        card.appendChild(name);
        card.appendChild(description);
        card.appendChild(button);
        card.appendChild(counter);


        // =========================
        // 2. JAVASCRIPT DESIGN
        // =========================

        document.body.style.margin = "0";
        document.body.style.fontFamily = "Arial, sans-serif";
        document.body.style.background =
            "linear-gradient(135deg, #12002f, #001f3f, #30004d)";
        document.body.style.color = "white";
        document.body.style.minHeight = "100vh";

        app.style.textAlign = "center";
        app.style.padding = "50px 20px";

        title.style.fontSize = "45px";
        title.style.color = "#00ffff";
        title.style.textShadow =
            "0 0 10px #00ffff, 0 0 30px #ff00ff";
        title.style.marginBottom = "10px";

        subtitle.style.color = "#ff66ff";
        subtitle.style.fontSize = "18px";

        card.style.maxWidth = "500px";
        card.style.margin = "40px auto";
        card.style.padding = "35px";
        card.style.borderRadius = "25px";
        card.style.background = "rgba(255,255,255,0.08)";
        card.style.border = "2px solid #00ffff";
        card.style.boxShadow =
            "0 0 20px #00ffff, 0 0 50px #ff00ff";

        name.style.color = "#ffff00";
        name.style.fontSize = "28px";

        description.style.lineHeight = "1.6";
        description.style.color = "#dddddd";

        button.style.padding = "15px 30px";
        button.style.border = "none";
        button.style.borderRadius = "30px";
        button.style.background =
            "linear-gradient(90deg, #00ffff, #ff00ff)";
        button.style.color = "white";
        button.style.fontSize = "16px";
        button.style.fontWeight = "bold";
        button.style.cursor = "pointer";
        button.style.boxShadow = "0 0 20px #ff00ff";

        counter.style.color = "#00ffff";


        // =========================
        // 3. INTERACTION
        // =========================

        let clicks = 0;

        const themes = [
            ["#12002f", "#001f3f", "#30004d"],
            ["#001f1f", "#003333", "#004d4d"],
            ["#2b001f", "#4d002b", "#190033"],
            ["#001a33", "#003d66", "#000d1a"]
        ];

        let themeIndex = 0;

        button.addEventListener("click", function () {

            clicks++;

            counter.textContent =
                "Button Clicks: " + clicks;

            themeIndex++;

            if (themeIndex >= themes.length) {
                themeIndex = 0;
            }

            const theme = themes[themeIndex];

            document.body.style.background =
                "linear-gradient(135deg, " +
                theme[0] + ", " +
                theme[1] + ", " +
                theme[2] + ")";

            title.style.color =
                clicks % 2 === 0 ? "#00ffff" : "#ffff00";

            button.style.transform = "scale(1.1)";

            setTimeout(function () {
                button.style.transform = "scale(1)";
            }, 200);
        });


        // =========================
        // 4. HOVER EFFECT
        // =========================

        button.addEventListener("mouseover", function () {
            button.style.boxShadow =
                "0 0 15px #00ffff, 0 0 40px #ff00ff";
        });

        button.addEventListener("mouseout", function () {
            button.style.boxShadow =
                "0 0 20px #ff00ff";
        });

    </script>

</body>
</html>
